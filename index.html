<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfe3e0">
<title>Grove</title>
<style>
/* Readex Pro ships with the app (variable weight, Arabic + Latin) so it works offline */
@font-face { font-family: 'Readex Pro'; src: url(fonts/readex-pro-arabic-wght-normal.woff2) format('woff2'); font-weight: 160 700; font-display: swap;
  unicode-range: U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC; }
@font-face { font-family: 'Readex Pro'; src: url(fonts/readex-pro-latin-wght-normal.woff2) format('woff2'); font-weight: 160 700; font-display: swap;
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* Registered so phase and landscape changes fade instead of snapping */
@property --sky1 { syntax: '<color>'; inherits: true; initial-value: #c9e0dc; }
@property --sky2 { syntax: '<color>'; inherits: true; initial-value: #f3e6cf; }
@property --m1   { syntax: '<color>'; inherits: true; initial-value: #a9c2b8; }
@property --m2   { syntax: '<color>'; inherits: true; initial-value: #7fa08f; }
@property --m3   { syntax: '<color>'; inherits: true; initial-value: #4f7563; }
@property --m4   { syntax: '<color>'; inherits: true; initial-value: #2c463a; }
@property --ink  { syntax: '<color>'; inherits: true; initial-value: #1d2b24; }
@property --sun  { syntax: '<color>'; inherits: true; initial-value: #f6d48f; }
@property --stars { syntax: '<number>'; inherits: true; initial-value: 0; }
@property --cloud { syntax: '<number>'; inherits: true; initial-value: .7; }
@property --lake  { syntax: '<number>'; inherits: true; initial-value: 0; }

:root {
  --font: 'Readex Pro', system-ui, sans-serif;
  --paper: #f7f1e5; --card: #fffdf8; --pk: #1d2b24;
  --line: rgb(29 43 36 / .09); --muted: rgb(29 43 36 / .72);
  --ease: cubic-bezier(.22, 1, .36, 1);
}
body[data-phase="focus"] { --sky1:#c9e0dc; --sky2:#f3e6cf; --m1:#a9c2b8; --m2:#7fa08f; --m3:#4f7563; --m4:#2c463a; --ink:#1d2b24; --sun:#f6d48f; --stars:0; --cloud:.75; }
body[data-phase="focus"][data-scene="lake"] { --sky1:#bcd9e6; --sky2:#eef1e4; --m1:#a3c4c4; --m2:#6d9a8c; --m3:#3f6e66; --m4:#2e4f4a; }
body[data-phase="focus"][data-scene="blossom"] { --sky1:#f3d3d6; --sky2:#fbeee6; --m1:#e4b9c0; --m2:#d79aa3; --m3:#a8737f; --m4:#5f4a52; --ink:#2d1f24; --sun:#fff0c8; }
body[data-phase="focus"][data-scene="autumn"] { --sky1:#f0c79a; --sky2:#f8e6cc; --m1:#dba57a; --m2:#c27a3e; --m3:#8f4f2a; --m4:#5a3a26; --ink:#2a1a10; --sun:#fbe3a4; }
body[data-phase="focus"][data-scene="snow"] { --sky1:#d9e4ee; --sky2:#f4f6f8; --m1:#c9d5df; --m2:#a8b8c6; --m3:#6f8494; --m4:#3c4c5a; --ink:#1e2a35; --sun:#fff6dc; --cloud:.9; }
body[data-phase="short"] { --sky1:#eeb58a; --sky2:#f8e2bf; --m1:#cfa489; --m2:#a67d68; --m3:#6e5546; --m4:#3d3029; --ink:#2a1d16; --sun:#fbe3a4; --stars:0; --cloud:.55; }
body[data-phase="long"] { --sky1:#142231; --sky2:#36475a; --m1:#2b3c4b; --m2:#213140; --m3:#172531; --m4:#0e1821; --ink:#ece6d6; --sun:#e9e3cf; --stars:1; --cloud:.12; }
body[data-scene="lake"] { --lake: 1; }

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: var(--font); font-weight: 300; color: var(--ink); background: var(--m4);
  overflow: hidden; -webkit-font-smoothing: antialiased;
  transition: --sky1 2.4s, --sky2 2.4s, --m1 2.4s, --m2 2.4s, --m3 2.4s, --m4 2.4s, --ink 2.4s, --sun 2.4s, --stars 2.4s, --cloud 2.4s, --lake 2.4s;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
b, strong { font-weight: 400; }
:focus-visible { outline: 2px solid #b85c34; outline-offset: 2px; }

/* ---------- Screens ---------- */
.screen { position: fixed; inset: 0; overflow: hidden; transition: opacity .45s var(--ease), transform .55s var(--ease); }
.screen[aria-hidden="true"] { opacity: 0; pointer-events: none; visibility: hidden; transform: translateX(calc(var(--dir, 1) * 40px)) scale(.985);
  transition: opacity .45s var(--ease), transform .55s var(--ease), visibility 0s .55s; }

/* ---------- Scene ---------- */
.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .sky-a { stop-color: var(--sky1); } .scene .sky-b { stop-color: var(--sky2); }
.l1 { fill: var(--m1); } .l2 { fill: var(--m2); } .l3 { fill: var(--m3); } .l4 { fill: var(--m4); }
.sun {
  position: absolute; left: 0; top: 0; width: calc(340px * var(--sc, 1)); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--sun) 55%, transparent), transparent);
  will-change: transform; transition: transform .3s linear;
}
.sun i { position: absolute; inset: 36.5%; border-radius: 50%; background: var(--sun); }
.sun.slow { transition: transform 1.5s var(--ease); }
#lake { fill: color-mix(in oklab, var(--sky1) 55%, var(--m2)); opacity: var(--lake); }
#stars { opacity: var(--stars); }
#stars circle { fill: #f5efdc; }
.flies { position: absolute; inset: 0; pointer-events: none; opacity: var(--stars); }
.flies span { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #f4dc8a; box-shadow: 0 0 8px 2px rgb(244 220 138 / .6); animation: drift 7s ease-in-out infinite alternate; will-change: transform, opacity; }
body:not([data-phase="long"]) .flies span { animation-play-state: paused; }
.clouds { position: absolute; inset: 0; overflow: hidden; pointer-events: none; opacity: var(--cloud); }
.clouds div { position: absolute; left: 0; animation: sail linear infinite; will-change: transform; }
.clouds svg { display: block; width: 100%; height: auto; fill: #fffaf0; }
#visitors .v3, #visitorsBack .v3 { color: var(--m3); } #visitors .v4 { color: var(--m4); }
#visitors g, #visitorsBack g { animation: fadeIn 1.4s ease both; }
.wx { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 2.4s; }
.wx.rain { opacity: .5; background-image: repeating-linear-gradient(104deg, transparent 0 22px, rgb(255 255 255 / .38) 22px 23px); background-size: 64px 128px; animation: rainfall .45s linear infinite; }
.wx.snow { opacity: .9; background-image: radial-gradient(circle, #fff 1.6px, transparent 2.2px), radial-gradient(circle, rgb(255 255 255 / .8) 1px, transparent 1.6px); background-size: 90px 90px, 54px 54px; animation: snowfall 7s linear infinite; }
.wx.fog { opacity: .75; background: linear-gradient(to top, rgb(238 238 232 / .9), rgb(238 238 232 / .35) 55%, rgb(238 238 232 / .1)); }
@keyframes rainfall { to { background-position: -15px 128px; } }
@keyframes snowfall { to { background-position: 0 90px, 0 54px; } }
.birds { position: absolute; top: 16%; left: 0; width: 70px; pointer-events: none; animation: sail 46s linear infinite; animation-delay: var(--bd, -10s); color: color-mix(in oklab, var(--m4) 70%, transparent); }
.birds[hidden] { display: none; }
.birds svg { width: 100%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.wxbox .results { display: grid; gap: 4px; }
.wxbox .results button { text-align: start; border: 0; padding: 8px 10px; border-radius: 10px; background: rgb(29 43 36 / .04); font-size: .86rem; }
@keyframes sail { from { transform: translateX(-110%); } to { transform: translateX(calc(100vw + 10%)); } }
@keyframes twinkle { 50% { opacity: .25; } }
@keyframes drift { 0% { transform: translate(0,0); opacity: .2; } 50% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: .3; } }
@keyframes fadeIn { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; translate: 0 14px; } }

/* ---------- Timer screen ---------- */
.topbar { position: absolute; inset-inline: 0; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: max(20px, env(safe-area-inset-top)) clamp(18px, 4vw, 44px) 0; animation: rise .9s .1s var(--ease) backwards; }
body.has-winctl .topbar { padding-top: 54px; }
.brand { font-weight: 400; font-size: 1.3rem; display: flex; gap: 8px; align-items: center; }
.brand svg { width: 20px; fill: var(--ink); }
.tools { display: flex; gap: 8px; align-items: center; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 0; display: grid; place-items: center; background: color-mix(in oklab, var(--paper) 50%, transparent); backdrop-filter: blur(8px); color: var(--ink); transition: transform .2s var(--ease), background .25s; }
body[data-phase="long"] .round, body[data-night] .round { background: color-mix(in oklab, var(--ink) 14%, transparent); }
.round:hover { background: color-mix(in oklab, var(--paper) 80%, transparent); }
.round:active { transform: scale(.92); }
.round svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.round[aria-pressed="true"] { background: color-mix(in oklab, var(--paper) 85%, transparent); }
.lvl { width: 46px; height: 46px; padding: 0; }
.lvl svg { width: 34px; height: 34px; stroke: none; }
.lvl .track { stroke: color-mix(in oklab, var(--ink) 18%, transparent); fill: none; stroke-width: 3; }
.lvl .fill { stroke: var(--ink); fill: none; stroke-width: 3; transition: stroke-dashoffset .8s var(--ease); }
.lvl text { fill: var(--ink); font: 400 13px var(--font); }

/* Timer: one centred column; the task sits on a slim line under the clock */
.focus { position: absolute; inset: 0; display: grid; place-items: center; padding: 76px clamp(16px, 5vw, 80px) 13vh; }
.side { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: clamp(12px, 2.4vh, 20px); width: min(100%, 600px); }
.side > * { animation: rise .9s var(--ease) backwards; }
.side > :nth-child(1) { animation-delay: .2s; } .side > :nth-child(2) { animation-delay: .28s; } .side > :nth-child(3) { animation-delay: .36s; } .side > :nth-child(n+4) { animation-delay: .44s; }
/* Phase tabs read as plain text with a sliding underline */
.modes { position: relative; display: inline-flex; gap: 22px; }
.modes button { position: relative; z-index: 1; font-size: .9rem; background: none; border: 0; padding: 4px 0 6px; opacity: .55; transition: opacity .25s; }
.modes button[aria-selected="true"] { opacity: 1; }
.ind { position: absolute; left: 0; transition: transform .55s var(--ease), width .55s var(--ease); }
.modes .ind { bottom: 0; height: 1.5px; border-radius: 2px; background: var(--ink); }

.dial { position: relative; width: min(78vw, 540px, 47vh); aspect-ratio: 1; display: grid; place-items: center; container-type: inline-size; }
.dial svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dial .face-bg { fill: color-mix(in oklab, var(--paper) 72%, transparent); }
body[data-phase="long"] .dial .face-bg, body[data-night] .dial .face-bg { fill: color-mix(in oklab, var(--ink) 7%, transparent); }
.dial .ticks { stroke: color-mix(in oklab, var(--ink) 25%, transparent); stroke-width: 1; }
.dial .track, .dial .fill { fill: none; stroke-width: 3; }
.dial .track { stroke: color-mix(in oklab, var(--ink) 10%, transparent); }
.dial .fill { stroke: var(--ink); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
.sundot { fill: var(--sun); stroke: var(--paper); stroke-width: 2; transition: cx .3s linear, cy .3s linear; }
.dial .face { display: grid; justify-items: center; gap: 10px; text-align: center; max-width: 64%; }
#clock { font: 300 14.5cqi/1 var(--font); letter-spacing: -.03em; direction: ltr; font-variant-numeric: tabular-nums; }
#clock.swap { animation: swap .7s var(--ease); }
@keyframes swap { 0% { opacity: .15; scale: .96; } }
.sess { display: flex; gap: 5px; }
.sess i { width: 22px; height: 4px; border-radius: 4px; background: color-mix(in oklab, var(--ink) 22%, transparent); transition: background .5s; }
.sess i.f { background: var(--ink); }
.sub { opacity: .65; font-size: max(.75rem, 2.9cqi); line-height: 1.4; }

.controls { display: flex; align-items: center; gap: 6px; padding: 6px; border-radius: 26px; direction: ltr;
  background: color-mix(in oklab, var(--paper) 72%, transparent); backdrop-filter: blur(14px);
  box-shadow: 0 16px 34px -22px rgb(20 40 30 / .55), inset 0 0 0 1px rgb(255 255 255 / .45); }
body[data-phase="long"] .controls, body[data-night] .controls { background: color-mix(in oklab, var(--ink) 12%, transparent); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .12); }
.ctl { display: grid; justify-items: center; gap: 3px; width: 84px; border: 0; background: none; padding: 6px 0 5px; border-radius: 20px; color: var(--ink); font-size: .78rem; transition: background .25s, opacity .2s; }
.ctl:hover:not(:disabled) { background: color-mix(in oklab, var(--paper) 60%, transparent); }
.ctl:active:not(:disabled) { transform: scale(.95); }
.ctl i { display: grid; place-items: center; }
.ctl svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.ctl span { white-space: nowrap; }
.ctl:disabled { opacity: .5; cursor: default; }
.tline { display: flex; gap: 10px; align-items: center; max-width: min(100%, 460px); padding-block: 6px; padding-inline: 6px 16px; border: 0; border-radius: 99px; color: var(--pk); text-align: start;
  background: color-mix(in oklab, var(--card) 86%, transparent); backdrop-filter: blur(10px); box-shadow: 0 12px 28px -18px rgb(20 40 30 / .5); transition: transform .2s var(--ease); }
.tline:active { transform: scale(.98); }
.tline .pot { width: 36px; height: 36px; border-radius: 50%; }
.tline .pot svg { width: 36px; height: 36px; }
.tl-txt { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.tline b { font-weight: 400; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tline:not(:has(.pot)) .tl-txt { padding-inline-start: 10px; }
.tline small { color: var(--muted); font-size: .82rem; white-space: nowrap; }
.tline > svg { width: 12px; height: 12px; flex: none; stroke: var(--muted); fill: none; stroke-width: 2; }
.suggest { display: flex; gap: 8px; align-items: center; max-width: min(100%, 460px); margin-top: -6px; padding: 6px 14px; border: 0; border-radius: 99px; font-size: .82rem; color: var(--pk); text-align: start;
  background: color-mix(in oklab, var(--card) 62%, transparent); backdrop-filter: blur(10px); }
.suggest[hidden] { display: none; }
.suggest i { font-style: normal; color: #9a7a2c; }
.suggest span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest b { font-weight: 400; }
.confirm, .goalask { width: min(100%, 380px); display: grid; gap: 10px; padding: 14px; border-radius: 18px; background: #1d2b24; color: #f8f2e6; box-shadow: 0 18px 40px -20px rgb(0 0 0 / .45); animation: rise .45s var(--ease); }
.confirm[hidden], .goalask[hidden], .controls[hidden] { display: none; }
.confirm p, .goalask p { font-size: .9rem; line-height: 1.5; }
.confirm .row, .goalask .row { display: flex; gap: 8px; }
.confirm button, .goalask button { flex: 1; border: 0; padding: 10px; border-radius: 12px; color: inherit; background: rgb(255 255 255 / .12); }
.confirm .warn { background: #c9673f; }
.goalask .ok { background: #e5bd72; color: #1d2b24; }
#play {
  display: flex; align-items: center; gap: 10px; padding: 16px 30px; border-radius: 999px; border: 0; background: var(--ink); color: var(--paper); white-space: nowrap;
  font-weight: 400; box-shadow: 0 14px 34px -14px rgb(20 40 30 / .7); transition: transform .2s var(--ease);
}
body[data-phase="long"] #play, body[data-night] #play { color: #142231; }
#play:active { transform: scale(.95); }
#play .ico { position: relative; width: 16px; height: 16px; }
#play svg { position: absolute; inset: 0; width: 100%; height: 100%; fill: currentColor; transition: opacity .3s ease, transform .4s var(--ease); }
#play .i-pause, #play.running .i-play { opacity: 0; transform: scale(.6) rotate(-30deg); }
#play.running .i-pause { opacity: 1; transform: none; }

@media (max-width: 760px) {
  .dial { width: min(78vw, 340px, 42vh); }
  .tline { border-radius: 22px; padding-block: 7px; }
  .tl-txt { display: grid; gap: 1px; }
  .tline small { overflow: hidden; text-overflow: ellipsis; }
  .ctl { width: 76px; }
}

/* Phones: tap targets near the 44 px guideline, a tighter day strip, a compact header */
/* "body" lifts these above the base rules that come later in the file */
@media (max-width: 560px), (pointer: coarse) {
  body .modes button { padding: 11px 2px 12px; }
  body .pg-period button { padding: 10px 14px; }
  body .nudge li button { padding: 10px 8px; }
  body .nogoal { padding: 10px 6px; }
  body .exampill { padding: 7px 12px; }
  body .suggest { padding-block: 10px; }
}
@media (max-width: 560px) {
  .week { gap: 4px; }
  .weekrow { gap: 6px; }
  .calbtn { width: 42px; border-radius: 14px; }
  .daycard { border-radius: 14px; padding: 9px 0 10px; }
  body .daycard small { font-size: .68rem; overflow: visible; }
  .daycard b { font-size: 1.15rem; }
  body .page-head > div:first-child { min-width: 0; flex: 1; }
  .exampills { flex-wrap: nowrap; overflow-x: auto; }
  .daybar { min-width: 0; flex: none; width: 34vw; }
  body .daybar .long, body .exampill .long { display: none; } body .daybar .short, body .exampill .short { display: inline; }
  .daybar small { flex-direction: column; gap: 2px; font-size: .8rem; }
  #play { padding: 15px 22px; }
}

/* No visible scrollbars anywhere; scrolling still works */
* { scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }

/* ---------- Pages (plan, grove) ---------- */
.page { background: var(--paper); color: var(--pk); }
.page-art { position: absolute; inset: 0 0 auto; height: 156px; overflow: hidden; z-index: -1; }
.page-art svg { width: 100%; height: 100%; display: block; }
.page-scroll { position: absolute; inset: 0; overflow-y: auto; isolation: isolate; padding: 0 clamp(16px, 4vw, 48px) 140px; overscroll-behavior: contain; }
.wrap { max-width: 1040px; margin: 0 auto; }
.page-head { position: relative; height: 156px; display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; padding-bottom: 20px; color: #f4efe2; }
.page-head h1 { font-weight: 400; font-size: clamp(1.6rem, 4vw, 2.2rem); }
.page-head p { opacity: .85; font-size: .92rem; margin-top: 2px; }
.daybar { display: grid; gap: 6px; min-width: min(260px, 48vw); }
.daybar .track { height: 8px; border-radius: 9px; background: rgb(255 255 255 / .18); overflow: hidden; }
.daybar .track span { display: block; height: 100%; border-radius: 9px; background: #e5bd72; transition: width .8s var(--ease); }
.daybar small { display: flex; justify-content: space-between; gap: 12px; font-size: .88rem; opacity: .95; }
.daybar .short { display: none; }
.label { font-size: .82rem; color: var(--muted); margin: 26px 2px 10px; display: flex; justify-content: space-between; }
.stagger > * { animation: rise .55s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 45ms); }

.weekrow { display: flex; gap: 8px; margin-top: 20px; }
.week { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.daycard { border: 1px solid var(--line); background: var(--card); border-radius: 18px; padding: 10px 0 12px; display: grid; justify-items: center; gap: 4px; transition: transform .25s var(--ease), background .3s, color .3s; }
.daycard:hover { transform: translateY(-2px); }
.daycard:active { transform: scale(.95); }
.daycard small { font-size: .8rem; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.daycard b { font-size: 1.3rem; font-weight: 300; }
.daycard .sprouts { display: flex; gap: 2px; height: 14px; align-items: flex-end; }
.daycard .sprouts i { width: 4px; border-radius: 4px 4px 0 0; background: var(--m3); }
.daycard[aria-pressed="true"] { background: var(--pk); color: var(--paper); border-color: var(--pk); }
.daycard[aria-pressed="true"] small { color: rgb(247 241 229 / .7); }
.daycard[aria-pressed="true"] .sprouts i { background: #e5bd72; }
.calbtn { flex: none; width: 54px; border-radius: 18px; border: 1.5px dashed rgb(29 43 36 / .22); display: grid; place-items: center; position: relative; color: var(--muted); transition: background .2s, color .2s; }
.calbtn:hover { background: rgb(29 43 36 / .03); }
.calbtn.on { background: var(--pk); border: 1.5px solid var(--pk); color: var(--paper); }
.calbtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
.calbtn input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }

.pot { flex: none; background: color-mix(in oklab, var(--c) 10%, white); display: grid; place-items: end center; overflow: hidden; }
/* One line to add a task: Enter plants it with the last choices, Details opens the sheet */
.add { margin-top: 18px; display: flex; gap: 10px; align-items: center; padding-block: 8px; padding-inline: 14px 8px; border-radius: 18px; background: var(--card); cursor: text;
  box-shadow: 0 14px 34px -28px rgb(20 40 30 / .5), inset 0 0 0 1px var(--line); transition: box-shadow .3s; }
.add:focus-within { box-shadow: 0 14px 34px -26px rgb(20 40 30 / .55), inset 0 0 0 1.5px rgb(29 43 36 / .28); }

.news { display: grid; gap: 18px; }

.sc-list { display: grid; gap: 8px; }

/* Bottom sheet: a task's details, or what to study next */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgb(15 25 20 / .38); opacity: 0; pointer-events: none; transition: opacity .3s; }

  display: grid; gap: 16px; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 26px 26px 0 0; background: var(--card); color: var(--pk);

.btn { border: 0; padding: 11px 18px; border-radius: 99px; font-size: .9rem; background: color-mix(in oklab, var(--pk) 6%, transparent); }

.exampills { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }

.exampill.soon { background: rgb(232 160 124 / .28); }
/* Wide screens: the queue keeps a reading width, subjects and the week move beside it */
.plan-cols { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: 28px; }

@media (min-width: 1000px) {
  .plan-cols { grid-template-columns: minmax(0, 700px) 300px; justify-content: center; }

}
.wchart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; height: 104px; padding: 12px 12px 8px; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); }

.dlist { display: grid; gap: 8px; }
.task { position: relative; border-radius: 18px; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); touch-action: pan-y; transition: box-shadow .25s; }
.task .face { position: relative; z-index: 1; display: grid; grid-template-columns: 22px 54px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px 8px 6px; border-radius: 18px; background: var(--card); cursor: pointer; transition: transform .3s var(--ease); }
.task.next, .task.open { box-shadow: inset 0 0 0 1.5px var(--c); }

.task.dragging { z-index: 5; box-shadow: 0 18px 40px -16px rgb(20 40 30 / .45), inset 0 0 0 1.5px var(--c); }
.task.dragging .face, .task.swiping .face { transition: none; }
.task.grow { animation: growIn .6s var(--ease); }
@keyframes growIn { from { opacity: 0; transform: translateY(-10px) scale(.96); } 60% { transform: scale(1.01); } }
.task .pot { width: 54px; height: 54px; border-radius: 15px; }
.task .pot svg { width: 48px; height: 48px; }
.task.done .pot { filter: saturate(.4); opacity: .7; }
.task.done .t { color: var(--muted); text-decoration: line-through; }
.handle { width: 22px; height: 40px; display: grid; place-items: center; color: rgb(29 43 36 / .28); cursor: grab; touch-action: none; }
.handle svg { width: 10px; height: 16px; fill: currentColor; }
.t { display: block; font-size: 1rem; line-height: 1.4; overflow-wrap: anywhere; }
/* Swiping uncovers what the swipe will do: right finishes, left moves to the next day */
.reveal { position: absolute; inset: 0; direction: ltr; border-radius: 18px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: .82rem; color: white; }
.reveal span { opacity: 0; transition: opacity .15s; }
.task.sw-r .reveal { background: #4f7d4a; } .task.sw-r .reveal span:first-child { opacity: 1; }
.task.sw-l .reveal { background: #b07a2a; } .task.sw-l .reveal span:last-child { opacity: 1; }
.kinds { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.kinds span { padding: 1px 7px; border-radius: 99px; background: color-mix(in oklab, var(--pk) 5%, transparent); }
.gprog { display: inline-flex; align-items: center; gap: 6px; }
.gprog i { width: 54px; height: 5px; border-radius: 3px; overflow: hidden; background: color-mix(in oklab, var(--c) 18%, white); }
.gprog b { display: block; height: 100%; background: var(--c); }
.meta { display: flex; gap: 6px 8px; align-items: center; margin-top: 4px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.stag { padding: 2px 8px; border-radius: 99px; background: color-mix(in oklab, var(--c) 12%, white); color: color-mix(in oklab, var(--c) 75%, black); }
.why { display: block; font-style: normal; font-size: .78rem; color: #9a7a2c; margin-top: 2px; }
.nudge { display: grid; gap: 10px; margin-top: 14px; padding: 14px 16px; border-radius: 18px; background: #fff6e4; box-shadow: inset 0 0 0 1px rgb(154 122 44 / .18); font-size: .9rem; line-height: 1.6; }
.nudge .row { display: flex; gap: 8px; flex-wrap: wrap; }
.nudge .btn { padding: 8px 14px; font-size: .86rem; }
.nudge ul { padding: 0; display: grid; gap: 6px; }
.nudge li { list-style: none; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgb(255 255 255 / .7); }
.nudge li > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nudge li i { width: 8px; height: 8px; border-radius: 3px; background: var(--c); flex: none; }
.nudge li button { border: 0; background: none; padding: 4px 8px; border-radius: 8px; font-size: .82rem; color: var(--muted); }
.nudge li button:hover { background: rgb(29 43 36 / .06); color: var(--pk); }
.tag { font-size: .78rem; padding: 1px 8px; border-radius: 6px; background: #f3e3d3; color: #8a4a2a; }
.upnext { padding: 2px 8px; border-radius: 99px; background: var(--pk); color: var(--paper); }
.go { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--pk); color: var(--paper); display: grid; place-items: center; transition: transform .2s var(--ease); }
.go:active { transform: scale(.9); }
.go svg { width: 14px; height: 14px; fill: currentColor; }
/* A task opens in place: the card grows with a big plant and quiet controls */
.task.open { background: color-mix(in oklab, var(--c) 5%, var(--card)); box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--c) 45%, white), 0 24px 48px -34px rgb(20 40 30 / .55); animation: open .4s var(--ease); }
.ehead { display: grid; grid-template-columns: 96px 1fr auto; gap: 14px; align-items: end; padding: 14px 14px 6px; }
.ehead .pot { width: 96px; height: 96px; border-radius: 26px; }
.ehead .pot svg { width: 92%; height: 92%; }
.etitle { width: 100%; min-width: 0; border: 0; outline: 0; background: none; font-size: 1.3rem; font-weight: 400; padding: 4px 0 6px; border-bottom: 1.5px dashed transparent; }
.etitle:hover, .etitle:focus { border-color: color-mix(in oklab, var(--c) 40%, white); }
.etitle::placeholder { color: rgb(29 43 36 / .35); }
.eclose { align-self: start; width: 36px; height: 36px; border: 0; border-radius: 50%; display: grid; place-items: center; background: none; color: var(--muted); }
.eclose:hover { background: rgb(29 43 36 / .05); }
.eclose svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
.ebody { display: grid; gap: 18px; padding: 6px 14px 14px; }
.sec { display: grid; gap: 8px; align-content: start; }
.sec > small { font-size: .8rem; color: var(--muted); }
.seeds { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.seed { position: relative; display: grid; justify-items: center; gap: 2px; border: 0; padding: 8px 2px; border-radius: 16px; background: none; font-size: .8rem; color: var(--muted); transition: background .25s, color .25s, transform .2s var(--ease); }

.seed[aria-pressed="true"] { color: var(--pk); background: color-mix(in oklab, var(--c) 12%, white); }

.eline { display: flex; gap: 14px 18px; flex-wrap: wrap; }
.picker { position: relative; }
.subjbtn { display: flex; align-items: center; gap: 9px; border: 0; padding-block: 9px; padding-inline: 10px 12px; border-radius: 14px; background: white; box-shadow: inset 0 0 0 1px var(--line); }
.subjbtn i { width: 14px; height: 14px; border-radius: 5px; background: var(--c); }
.subjbtn svg { width: 12px; height: 12px; stroke: var(--muted); fill: none; stroke-width: 2; }
.menu { position: absolute; z-index: 5; top: calc(100% + 6px); inset-inline-start: 0; width: 300px; display: grid; padding: 6px; border-radius: 18px; background: var(--card); box-shadow: 0 24px 50px -20px rgb(20 40 30 / .45), inset 0 0 0 1px var(--line); animation: open .3s var(--ease); }

.opt { display: flex; align-items: center; gap: 10px; border: 0; padding: 9px 10px; border-radius: 12px; background: none; text-align: start; cursor: pointer; }
.opt:hover, .opt[aria-current="true"] { background: rgb(29 43 36 / .05); }
.opt i { width: 14px; height: 14px; border-radius: 5px; flex: none; background: var(--cc); }
.opt span { flex: 1; }
.oedit { border: 0; background: none; font-size: .8rem; color: var(--muted); padding: 2px 6px; border-radius: 8px; }
.oedit:hover { background: rgb(29 43 36 / .07); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.onew { color: var(--muted); }
.dayseg { display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: rgb(29 43 36 / .05); }
.dayseg button, .dayseg label { position: relative; border: 0; background: none; padding: 7px 12px; border-radius: 11px; font-size: .84rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.dayseg [aria-pressed="true"] { background: white; color: var(--pk); box-shadow: 0 1px 3px rgb(0 0 0 / .08); }
.dayseg input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }
.goalrow { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.goalrow .grow { flex: 1; }
.gdial { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 16px; background: white; box-shadow: inset 0 0 0 1px var(--line); }
.gdial button { width: 36px; height: 36px; border: 0; border-radius: 12px; background: none; font-size: 1.2rem; color: var(--muted); }

.gtrack { flex: 1; min-width: 140px; display: grid; gap: 5px; font-size: .8rem; color: var(--muted); }
.gtrack i { height: 6px; border-radius: 4px; overflow: hidden; background: color-mix(in oklab, var(--c) 15%, white); }
.gtrack b { display: block; height: 100%; background: var(--c); transition: width .4s var(--ease); }
.nogoal { border: 0; background: none; font-size: .8rem; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
.efoot { display: flex; gap: 6px; align-items: center; padding-top: 12px; border-top: 1px solid var(--line); }
.efoot button { border: 0; background: none; padding: 9px 12px; border-radius: 12px; font-size: .84rem; color: var(--muted); }
.efoot button:hover { background: rgb(29 43 36 / .05); color: var(--pk); }
.efoot .grow { flex: 1; }
.efoot .del { color: #a3402a; }
.efoot .main, .efoot .main:hover { background: var(--pk); color: var(--paper); }
@media (max-width: 560px) {
  .seeds { grid-template-columns: repeat(3, 1fr); }
  .ehead { grid-template-columns: 72px 1fr auto; }
  .ehead .pot { width: 72px; height: 72px; border-radius: 20px; }
  .menu { width: min(300px, calc(100vw - 56px)); }
}
.go.redo { background: color-mix(in oklab, var(--pk) 8%, transparent); color: var(--pk); }
.go.redo svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
html[dir="rtl"] .go svg { transform: scaleX(-1); }
.empty-day { font-size: .85rem; color: var(--muted); padding: 2px 4px; }

/* Inline planting and editing */
.composer { display: grid; gap: 14px; padding: 14px; border-radius: 18px; background: color-mix(in oklab, var(--c) 9%, white); border: 1.5px solid color-mix(in oklab, var(--c) 35%, white); animation: open .45s var(--ease); }
@keyframes open { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.composer input[type=text], .composer input[type=date] { border: 0; background: white; border-radius: 12px; padding: 12px 14px; font-size: 1rem; width: 100%; box-shadow: inset 0 0 0 1px var(--line); }
.composer input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--c); }
.c-row { display: grid; gap: 8px; }
.c-row > span { font-size: .82rem; color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--sw); transition: transform .2s var(--ease); }
.swatches button[aria-pressed="true"] { outline: 2px solid var(--pk); outline-offset: 2px; transform: scale(1.08); }
.c-foot { display: flex; gap: 8px; align-items: center; }
.c-foot .grow { flex: 1; }
.primary { border: 0; border-radius: 99px; padding: 11px 22px; background: var(--c, #2c463a); color: white; display: flex; gap: 8px; align-items: center; transition: transform .2s var(--ease); font-weight: 400; }
.primary:active { transform: scale(.95); }

.danger.armed { background: #a3402a; color: white; }

.newsubj { border: 1.5px dashed rgb(29 43 36 / .2); background: none; border-radius: 22px; min-height: 96px; color: var(--muted); display: grid; place-items: center; transition: background .2s, border-color .2s; }
.newsubj:hover { background: rgb(29 43 36 / .03); border-color: rgb(29 43 36 / .35); }
.welcome { background: var(--card); border-radius: 22px; border: 1px solid var(--line); padding: 22px; display: grid; gap: 14px; margin-top: 22px; }
.welcome p { line-height: 1.7; color: var(--muted); }
.welcome .primary { justify-content: center; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.subjects + .subj { margin-top: 12px; }
/* Subjects are small cards with a colour edge */
.scard { --c: #4f7563; position: relative; overflow: hidden; display: grid; gap: 2px; border: 0; padding-block: 12px; padding-inline: 18px 14px; border-radius: 16px; text-align: start; background: var(--card); box-shadow: inset 0 0 0 1px var(--line); transition: transform .2s var(--ease); }
.scard:active { transform: scale(.97); }
.scard::before { content: ''; position: absolute; inset-block: 10px; inset-inline-start: 0; width: 5px; border-start-end-radius: 4px; border-end-end-radius: 4px; background: var(--c); }
.scard b { font-weight: 400; }
.scard small { font-size: .8rem; color: var(--muted); }

.scard.add-s { place-items: center; color: var(--muted); background: none; box-shadow: none; outline: 1.5px dashed rgb(29 43 36 / .2); outline-offset: -1.5px; }
.scard.add-s::before { display: none; }
.anycolor { position: relative; width: 32px; height: 32px; border-radius: 50%; background: conic-gradient(#e2584a, #e8b33c, #6cae4f, #3f9fb5, #6a5cc8, #c75aa6, #e2584a); }
.anycolor.on { outline: 2px solid var(--pk); outline-offset: 2px; }
.anycolor input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

/* Progress */
.pg-period { display: flex; gap: 2px; padding: 3px; border-radius: 14px; background: rgb(255 255 255 / .12); }
.pg-period button { border: 0; background: none; padding: 7px 14px; border-radius: 11px; font-size: .86rem; color: rgb(244 239 226 / .8); transition: background .2s, color .2s; }
.pg-period [aria-pressed="true"] { background: #f4efe2; color: var(--pk); }
.pg-period.light { justify-self: start; background: rgb(29 43 36 / .06); }
.pg-period.light button { color: var(--muted); }
.pg-period.light [aria-pressed="true"] { background: var(--card); color: var(--pk); box-shadow: 0 1px 3px rgb(29 43 36 / .12); }
.pg { display: grid; gap: 14px; margin-top: 18px; }
.pg-card { background: var(--card); border-radius: 20px; padding: 16px 18px; box-shadow: inset 0 0 0 1px var(--line); min-width: 0; }
.pg-card h3 { font-weight: 400; font-size: .98rem; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.pg-card h3 small { font-size: .8rem; color: var(--muted); }
.pg-two { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 14px; }
.pg-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.pg-kpi { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 2px; align-content: start; }
.pg-kpi small { font-size: .8rem; color: var(--muted); }
.pg-kpi b { font-weight: 400; font-size: 1.5rem; line-height: 1.25; }
.pg-kpi span { font-size: .8rem; color: var(--muted); }
.pg-kpi .up { color: #3f7a3a; } .pg-kpi .down { color: #a3402a; }
.pg-ins { display: grid; gap: 8px; }
.pg-ins > div { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 16px; background: color-mix(in oklab, var(--c) 8%, white); font-size: .93rem; line-height: 1.6; }
.pg-ins i { flex: none; width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in oklab, var(--c) 18%, white); color: var(--c); font-style: normal; }
.pg-ins b { font-weight: 400; }
.pg-bars { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: var(--gap, 10px); height: 190px; }
.pg-col { display: grid; grid-template-rows: minmax(0, 1fr) auto auto; justify-items: center; gap: 4px; min-width: 0; height: 100%; min-height: 0; }
.pg-box { position: relative; width: 100%; height: 100%; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
.pg-stack { width: min(62%, 28px); display: flex; flex-direction: column-reverse; border-radius: 6px 6px 3px 3px; overflow: hidden; transition: height .6s var(--ease); }
.pg-stack span { display: block; }
.pg-plan { position: absolute; inset-inline: 8%; border-top: 1.5px dashed rgb(29 43 36 / .32); }
.pg-col b { font-weight: 400; font-size: .78rem; min-height: 1.2em; }
.pg-col small { font-size: .74rem; color: var(--muted); white-space: nowrap; min-height: 1.2em; }
.pg-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: .8rem; color: var(--muted); }
.pg-legend span { display: inline-flex; gap: 6px; align-items: center; }
.pg-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.pg-legend .dash { width: 14px; height: 0; border-radius: 0; border-top: 1.5px dashed rgb(29 43 36 / .4); background: none; }
.pg-heat { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
.pg-heat > div { display: grid; gap: 4px; }
.pg-heat i { aspect-ratio: 1; border-radius: 4px; background: var(--h); }
.pg-heat i.f { background: none; box-shadow: inset 0 0 0 1px var(--line); }
.pg-key { display: flex; gap: 4px; align-items: center; justify-content: flex-end; margin-top: 10px; font-size: .78rem; color: var(--muted); }
.pg-key i { width: 12px; height: 12px; border-radius: 3px; background: var(--h); }
.pg-subj { display: grid; grid-template-columns: minmax(60px, 90px) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: .9rem; }
.pg-subj > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pg-subj .t { height: 10px; border-radius: 6px; background: rgb(29 43 36 / .06); overflow: hidden; }
.pg-subj .t span { display: block; height: 100%; border-radius: 6px; background: var(--c); }
.pg-subj small { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.pg-hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 96px; align-items: end; }
.pg-hours i { border-radius: 3px 3px 1px 1px; background: #c9d8c4; }
.pg-hours i.top { background: #4f7d4a; }
.pg-hl { display: flex; justify-content: space-between; font-size: .74rem; color: var(--muted); margin-top: 6px; }
.pg-exam { display: grid; grid-template-columns: 60px 1fr; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.pg-exam:first-of-type { border-top: 0; padding-top: 0; }
.pg-exam svg { width: 60px; height: 60px; }
.pg-exam small { display: block; font-size: .82rem; color: var(--muted); margin-top: 2px; }
.pg-ft { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pg-ft div { text-align: center; padding: 10px 4px; border-radius: 14px; background: rgb(29 43 36 / .035); }
.pg-ft b { display: block; font-weight: 400; font-size: 1.35rem; }
.pg-ft small { font-size: .78rem; color: var(--muted); }
.pg-late { margin-top: 12px; padding: 0; font-size: .88rem; }
.pg-late li { list-style: none; display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }
.pg-late small { color: #a3402a; white-space: nowrap; }
.pg-none { font-size: .86rem; color: var(--muted); line-height: 1.7; }
.pg-rewards { display: flex; gap: 16px; align-items: center; background: #2c463a; color: #eef3e6; border-radius: 22px; padding: 14px 18px; }
.pg-rewards svg { width: 60px; height: 60px; flex: none; }
.pg-rewards b { font-weight: 400; font-size: 1.08rem; }
.pg-rewards small { display: block; opacity: .82; font-size: .84rem; margin-top: 2px; }
.pg-rewards .xpbar { margin: 8px 0 0; height: 6px; }
.pg-rewards > div { flex: 1; min-width: 0; }
.pg-rewards button { flex: none; border: 0; padding: 9px 14px; border-radius: 12px; background: rgb(255 255 255 / .12); color: inherit; font-size: .86rem; }
.pg-parents { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.pg-pc { background: var(--card); border-radius: 18px; padding: 16px; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 8px; align-content: start; }
.pg-pc b { font-weight: 400; }
.pg-pc p { font-size: .86rem; color: var(--muted); line-height: 1.6; }
.pg-pc .row2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.pg-pc .btn { padding: 9px 14px; font-size: .86rem; }
.pg-pc code { direction: ltr; display: block; text-align: center; font: 400 1.05rem/1 ui-monospace, monospace; letter-spacing: .1em; padding: 11px; border-radius: 10px; background: rgb(29 43 36 / .05); }
.pg-pc .err { font-size: .82rem; color: #a3402a; }
.pg-viewing { display: flex; gap: 12px; align-items: center; justify-content: space-between; padding: 10px 14px; margin-top: 16px; border-radius: 16px; background: #fff6e4; font-size: .88rem; }
.pg-report img { width: 100%; border-radius: 18px; box-shadow: 0 0 0 1px var(--line); }
.pg-report + .hint + .sfoot { flex-wrap: wrap; }
body.parent .dock, body.parent #s-timer, body.parent #s-plan { display: none; }
@media (max-width: 820px) {
  .pg-kpis { grid-template-columns: repeat(2, 1fr); }
  .pg-two, .pg-parents { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .pg-period button { padding: 6px 10px; }
  .pg-bars { height: 160px; }
  .pg-rewards { flex-wrap: wrap; }
}

/* Grove (rewards) */
.hero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; background: #2c463a; color: #eef3e6; border-radius: 26px; padding: 22px 26px; margin-top: 20px; }
.hero svg.tree { width: 120px; height: 120px; }
.hero h2 { font-weight: 400; font-size: 1.55rem; }
.hero p { opacity: .8; font-size: .9rem; margin-top: 4px; }
.xpbar { height: 10px; border-radius: 99px; background: rgb(255 255 255 / .14); margin: 14px 0 10px; overflow: hidden; }
.xpbar span { display: block; height: 100%; background: #e5bd72; border-radius: 99px; transition: width .8s var(--ease); }
.stats { display: flex; gap: 24px; font-size: .82rem; opacity: .92; flex-wrap: wrap; }
.stats b { display: block; font-size: 1.35rem; font-weight: 300; }
.today { display: flex; align-items: flex-end; gap: 6px; min-height: 44px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.today svg { width: 22px; height: 38px; flex: none; transform-origin: bottom; }
.today .none { color: var(--muted); font-size: .88rem; align-self: center; }
.today .sum { margin-inline-start: auto; color: var(--muted); font-size: .85rem; align-self: center; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
.critter { background: var(--card); border-radius: 20px; border: 1px solid var(--line); padding: 14px 10px; text-align: center; font-size: .88rem; transition: transform .25s var(--ease); }
.critter:hover { transform: translateY(-3px); }
.critter svg { width: 72px; height: 72px; color: #2c463a; display: block; margin: 0 auto 6px; }
.critter small { display: block; color: var(--muted); font-size: .78rem; margin-top: 2px; }
.critter.locked svg { color: rgb(29 43 36 / .13); }
.critter.locked { color: var(--muted); }
.scapes { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
.scape { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--card); font-size: .85rem; padding: 0; text-align: start; transition: transform .25s var(--ease); }
.scape:not(:disabled):hover { transform: translateY(-3px); }
.scape:disabled { cursor: default; }
.scape svg { display: block; width: 100%; height: 80px; }
.scape div { padding: 9px 12px; display: flex; justify-content: space-between; gap: 6px; }
.scape small { color: var(--muted); font-size: .78rem; }
.scape.current { outline: 2px solid var(--pk); outline-offset: -2px; }
.scape.locked svg { filter: grayscale(1) opacity(.45); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.badge { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; }
.badge .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #f1e4c9; flex: none; }
.badge .ico svg { width: 20px; height: 20px; stroke: #8a5a1f; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.badge.locked .ico { background: #eceae4; } .badge.locked .ico svg { stroke: #a7a59c; }
.badge b { display: block; font-size: .92rem; }
.badge span { font-size: .82rem; color: var(--muted); }
.badge.locked b { color: var(--muted); }

/* ---------- Dock ---------- */
.dock {
  position: fixed; z-index: 5; bottom: max(18px, env(safe-area-inset-bottom)); left: 50%; translate: -50% 0;
  display: flex; gap: 4px; padding: 6px; border-radius: 26px; background: rgb(29 43 36 / .84); backdrop-filter: blur(16px);
  box-shadow: 0 18px 40px -16px rgb(0 0 0 / .55); animation: dockIn .9s .4s var(--ease) backwards;
}
@keyframes dockIn { from { opacity: 0; translate: -50% 24px; } }
.dock .ind { top: 6px; bottom: 6px; border-radius: 20px; background: var(--paper); }
.dock button { position: relative; z-index: 1; border: 0; background: none; color: rgb(247 241 229 / .75); display: flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 20px; font-size: .92rem; transition: color .35s; }
.dock button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.dock button[aria-selected="true"] { color: var(--pk); }

/* ---------- Desktop window controls ---------- */
.winctl { position: fixed; z-index: 8; top: 10px; right: 12px; display: flex; gap: 2px; padding: 4px; border-radius: 14px; background: rgb(29 43 36 / .55); backdrop-filter: blur(10px); direction: ltr; }
.winctl[hidden] { display: none; }
.winctl button { width: 34px; height: 30px; border: 0; border-radius: 10px; background: none; color: #f4efe2; display: grid; place-items: center; transition: background .2s; }
.winctl button:hover { background: rgb(255 255 255 / .14); }
.winctl #winClose:hover { background: #c4472f; }
.winctl svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; }
.dragbar { position: fixed; z-index: 7; inset: 0 0 auto; height: 44px; }
.dragbar[hidden] { display: none; }

/* ---------- Sync box (in settings) ---------- */
.syncbox { grid-template-columns: minmax(0, 1fr); margin-top: 10px; padding: 16px; border-radius: 18px; background: white; box-shadow: inset 0 0 0 1px var(--line); display: grid; gap: 10px; }
.syncbox h3 { font-weight: 400; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.syncbox h3 .dot { width: 8px; height: 8px; border-radius: 50%; background: #a7a59c; }
.syncbox h3 .dot.ok { background: #4f7d4a; } .syncbox h3 .dot.busy { background: #e5bd72; animation: twinkle 1s infinite; } .syncbox h3 .dot.error, .syncbox h3 .dot.offline { background: #c4472f; }
.syncbox textarea { width: 100%; min-height: 70px; border: 0; border-radius: 12px; padding: 10px; font: 400 .78rem/1.4 ui-monospace, monospace; direction: ltr; background: rgb(29 43 36 / .04); box-shadow: inset 0 0 0 1px var(--line); resize: vertical; }
.syncbox input[type=file] { font-size: .82rem; }
.syncbox p { font-size: .82rem; color: var(--muted); line-height: 1.6; }
.qr { justify-self: center; width: 200px; height: 200px; padding: 12px; border-radius: 18px; background: white; box-shadow: 0 8px 24px -16px rgb(0 0 0 / .35), inset 0 0 0 1px var(--line); animation: open .45s var(--ease); }
.qr svg { width: 100%; height: 100%; display: block; }
.scan { display: flex; gap: 8px; align-items: center; justify-content: center; }
.scan svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.scanner { position: fixed; inset: 0; z-index: 30; background: #000; display: grid; place-items: center; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scanner .frame { position: relative; width: min(66vw, 280px); aspect-ratio: 1; border-radius: 24px; outline: 2px solid rgb(255 255 255 / .9); box-shadow: 0 0 0 100vmax rgb(0 0 0 / .45); }
.scanner button { position: absolute; bottom: max(36px, calc(env(safe-area-inset-bottom) + 20px)); border: 0; padding: 12px 30px; border-radius: 99px; background: rgb(255 255 255 / .92); color: #1d2b24; font-size: 1rem; }
.code { direction: ltr; font: 400 1.05rem ui-monospace, Consolas, monospace; letter-spacing: .06em; padding: 12px; border-radius: 12px; background: #f3eee3; text-align: center; user-select: all; word-break: break-all; }
.syncbox .line { display: flex; gap: 8px; align-items: center; }
.syncbox input { flex: 1; min-width: 0; direction: ltr; font: 400 .95rem ui-monospace, Consolas, monospace; padding: 10px 12px; border-radius: 12px; border: 1px solid rgb(0 0 0 / .15); background: white; text-transform: uppercase; }
.syncbox .err { color: #a3402a; font-size: .8rem; }
.syncbox .primary { justify-content: center; }
.syncbox .quiet { padding: 8px 4px; }

/* ---------- Dialogs & toasts ---------- */
dialog {
  margin: auto; border: 0; border-radius: 24px; padding: 24px; width: min(420px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: hidden auto; overscroll-behavior: contain; background: var(--paper); color: var(--pk);
  box-shadow: 0 30px 80px -20px rgb(0 0 0 / .35);
  opacity: 0; transform: translateY(14px) scale(.97);
  transition: opacity .28s ease, transform .4s var(--ease), overlay .4s allow-discrete, display .4s allow-discrete;
}
dialog[open] { opacity: 1; transform: none; }
@starting-style { dialog[open] { opacity: 0; transform: translateY(14px) scale(.97); } }
dialog::backdrop { background: rgb(15 25 20 / 0); transition: background .35s, backdrop-filter .35s, overlay .4s allow-discrete, display .4s allow-discrete; }
dialog[open]::backdrop { background: rgb(15 25 20 / .28); backdrop-filter: blur(3px); }
@starting-style { dialog[open]::backdrop { background: rgb(15 25 20 / 0); } }
dialog h2 { font-weight: 400; font-size: 1.3rem; margin-bottom: 14px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid rgb(0 0 0 / .07); gap: 12px; }
.row:last-of-type { border-bottom: 0; }
.row input[type=number] { width: 72px; padding: 6px 8px; border-radius: 10px; border: 1px solid rgb(0 0 0 / .15); background: white; text-align: center; }
.row input[type=checkbox] { width: 20px; height: 20px; accent-color: #3f6b55; }
.row select { padding: 6px 10px; border-radius: 10px; border: 1px solid rgb(0 0 0 / .15); background: white; }
.dlg-foot { display: flex; justify-content: flex-end; margin-top: 16px; }
/* A new version is out: one tap updates (desktop) or downloads it for the installer (Android) */
.updatebar { position: fixed; z-index: 12; top: max(18px, calc(env(safe-area-inset-top) + 12px)); left: 50%; translate: -50% 0; display: flex; gap: 8px; align-items: center; border: 0; padding: 9px 18px; border-radius: 99px; background: #1d2b24; color: #f8f2e6; font-size: .88rem; white-space: nowrap; box-shadow: 0 12px 30px -12px rgb(0 0 0 / .45); animation: rise .6s var(--ease); }
.updatebar[hidden] { display: none; }
.updatebar b { color: #e5bd72; font-weight: 400; }
.updatebar:disabled { opacity: .8; cursor: default; }
.sounds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.sounds button { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; border: 1px solid rgb(0 0 0 / .1); background: white; text-align: start; transition: transform .2s var(--ease), background .2s, border-color .2s; }
.sounds button:active { transform: scale(.96); }
.sounds button svg { width: 22px; height: 22px; stroke: #3f6b55; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sounds button[aria-pressed="true"] { border-color: #3f6b55; background: #e5eee6; }
.sounds .mix { display: grid; gap: 6px; }
.sounds .mix input { width: 100%; accent-color: #3f6b55; }
.sounds .mix input[hidden] { display: none; }
input[type=range] { width: 100%; accent-color: #3f6b55; }
.vol { display: flex; align-items: center; gap: 12px; font-size: .9rem; }

.goalask input { width: 100%; border: 0; border-radius: 12px; padding: 10px 12px; font: inherit; font-size: .88rem; color: #f8f2e6; background: rgb(255 255 255 / .1); }
.goalask input::placeholder { color: rgb(248 242 230 / .55); }
.goalask small { font-size: .8rem; opacity: .75; }
.breaktip { width: min(100%, 380px); display: grid; gap: 8px; justify-items: center; text-align: center; padding: 14px; border-radius: 18px; background: color-mix(in oklab, var(--card) 70%, transparent); backdrop-filter: blur(10px); animation: rise .45s var(--ease); }
.breaktip[hidden] { display: none; }
.breaktip b { font-weight: 400; }
.breaktip p { font-size: .86rem; color: var(--muted); line-height: 1.55; }
.breaktip button { border: 0; background: none; font-size: .8rem; color: var(--muted); padding: 4px 10px; border-radius: 99px; }
.breaktip button:hover { background: rgb(29 43 36 / .06); }
.breath { position: relative; width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgb(255 255 255 / .95), rgb(255 255 255 / .4)); box-shadow: 0 0 0 10px rgb(255 255 255 / .25); animation: breathe 8s ease-in-out infinite; font-size: .86rem; }
.breath span { position: absolute; animation: say 8s steps(1) infinite; }
.breath span + span { animation-delay: -4s; }
@keyframes breathe { 0%, 100% { transform: scale(.78); } 50% { transform: scale(1.05); } }
@keyframes say { 0% { opacity: 1; } 50% { opacity: 0; } }
.streakchip { font-size: .8rem; padding: 4px 10px; border-radius: 99px; background: color-mix(in oklab, var(--card) 70%, transparent); backdrop-filter: blur(8px); }
.streakchip[hidden] { display: none; }
#groveTrees svg { animation: fadeIn 1.4s ease both; }
.reward { position: fixed; z-index: 12; left: 50%; top: max(76px, calc(env(safe-area-inset-top) + 64px)); translate: -50% 0; width: min(92vw, 380px); display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 18px; background: #1d2b24; color: #f8f2e6;
  box-shadow: 0 18px 40px -20px rgb(0 0 0 / .5); transition: opacity .4s, transform .5s var(--ease); }
.reward[hidden] { display: flex; opacity: 0; transform: translateY(-14px); pointer-events: none; }
.reward svg { width: 34px; height: 56px; flex: none; }
.reward b { font-weight: 400; }
.reward small { display: block; opacity: .8; font-size: .8rem; margin-top: 2px; }
.ch-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.ch-chips span { display: inline-flex; gap: 4px; align-items: center; padding: 4px 6px 4px 10px; border-radius: 10px; background: color-mix(in oklab, var(--c) 12%, white); font-size: .84rem; }
.ch-chips span button { border: 0; background: none; padding: 0 4px; color: var(--muted); }
.ch-chips input { flex: 1; min-width: 120px; border: 0; border-radius: 10px; padding: 6px 10px; background: white; box-shadow: inset 0 0 0 1px var(--line); font: inherit; font-size: .86rem; }
.lims { display: flex; gap: 6px; flex-wrap: wrap; }
.lims button { border: 0; padding: 6px 12px; border-radius: 99px; background: rgb(29 43 36 / .06); font-size: .84rem; }
.lims [aria-pressed="true"] { background: var(--c); color: white; }
.ppreview { display: grid; gap: 6px; }
.ppreview div { display: grid; grid-template-columns: minmax(70px, auto) 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgb(255 255 255 / .7); font-size: .86rem; }
.ppreview small { color: var(--muted); }
.ppreview .last { background: #fbefe6; }
.fr-m { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.fr-m:first-of-type { border-top: 0; }
.fr-av { position: relative; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: #e9e1cf; font-size: .92rem; }
.fr-av.on::after { content: ''; position: absolute; inset-inline-end: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 2px var(--card); }
.fr-m small { display: block; font-size: .78rem; color: var(--muted); }
.fr-lb { display: grid; gap: 8px; }
.fr-lb div { display: grid; grid-template-columns: minmax(60px, 90px) 1fr auto; gap: 8px; align-items: center; font-size: .86rem; }
.fr-lb i { height: 10px; border-radius: 6px; background: #4f7d4a; min-width: 2px; }
.fr-lb .me i { background: #e5bd72; }
.fr-lb small { color: var(--muted); white-space: nowrap; }
.fr-form { display: grid; gap: 8px; }
.fr-form input { border: 0; border-radius: 12px; padding: 10px 12px; background: white; box-shadow: inset 0 0 0 1px var(--line); font: inherit; font-size: .9rem; }
.fr-form .err { font-size: .82rem; color: #a3402a; }
.pg-mist { display: grid; grid-template-columns: 24px 1fr; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: .88rem; line-height: 1.5; text-align: start; width: 100%; border-inline: 0; border-bottom: 0; background: none; }
.pg-mist:first-of-type { border-top: 0; }
.pg-mist i { width: 20px; height: 20px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px rgb(29 43 36 / .25); }
.pg-mist.done i { background: #4f7d4a; box-shadow: none; }
.pg-mist.done span { color: var(--muted); text-decoration: line-through; }
.pg-mist small { display: block; color: var(--muted); font-size: .78rem; }
#toasts { position: fixed; z-index: 10; top: max(76px, calc(env(safe-area-inset-top) + 64px)); left: 50%; translate: -50% 0; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
.toast { background: #1d2b24; color: #f8f2e6; padding: 10px 18px; border-radius: 999px; font-size: .92rem; box-shadow: 0 12px 30px -10px rgb(0 0 0 / .4); white-space: nowrap; animation: toast 3.6s var(--ease) both; }
.toast b { color: #e5bd72; }
.toast:has(button) { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 18px; }
.toast button { border: 0; background: none; color: #e5bd72; padding: 6px 12px; border-radius: 99px; }
@keyframes toast { 0% { opacity: 0; transform: translateY(-12px) scale(.96); } 10%, 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-6px); } }

@media (max-width: 720px) {
  .dock button span { display: none; }
  .dock button[aria-selected="true"] span { display: inline; }
  .dock button { padding: 13px 24px; }
  .week { gap: 5px; }
  .daycard { border-radius: 14px; }
  .daycard b { font-size: 1.1rem; }
  .calbtn { width: 42px; border-radius: 14px; }
  .task .face { grid-template-columns: 20px 46px 1fr auto; gap: 8px; padding: 8px 10px 8px 4px; }
  .task .pot { width: 46px; height: 46px; border-radius: 13px; } .task .pot svg { width: 42px; height: 42px; }
  .hero { grid-template-columns: 1fr; text-align: center; justify-items: center; }
  .stats { justify-content: center; }
  .focus { padding-bottom: 18vh; }
}
@media (hover: none) {
  .round, .controls, .tline, .dock, .winctl { backdrop-filter: none; }
  .controls { background: color-mix(in oklab, var(--paper) 90%, transparent); }
  .round { background: color-mix(in oklab, var(--paper) 72%, transparent); }
  .tline { background: color-mix(in oklab, var(--card) 95%, transparent); }

}

function hourMinutes(log) {
  const h = Array(24).fill(0);
  for (const e of log) h[new Date(e.at - e.m * 6e4).getHours()] += e.m;
  return h;
}
function bestWindow(h) {
  let best = -1, at = 0;
  for (let i = 0; i < 24; i++) { const v = h[i] + h[(i + 1) % 24] + h[(i + 2) % 24]; if (v > best) { best = v; at = i; } }
  return at;
}
const upcomingExams = () => liveSubjects().filter(s => s.exam && s.exam >= today()).sort((a, b) => a.exam.localeCompare(b.exam));
const lastP = () => t(period === 'month' ? 'lastMonth' : 'lastWeek');

function kpisHTML(cur, prev) {
  const delta = (a, b, fmt) => !prev ? '' : a === b ? `<span>${t('sameAs', { p: lastP() })}</span>`
    : `<span class="${a > b ? 'up' : 'down'}">${t(a > b ? 'moreThan' : 'lessThan', { m: fmt(Math.abs(a - b)), p: lastP() })}</span>`;
  return `<div class="pg-kpis">
    <div class="pg-kpi"><small>${t('kFocus')}</small><b>${hoursText(cur.minutes)}</b>${prev ? delta(cur.minutes, prev.minutes, hoursText) : `<span>${t('inSessions', { n: num(state.sessions) })} ${t('focusSessions')}</span>`}</div>
    <div class="pg-kpi"><small>${t('kStreak')}</small><b>${daysText(streak())}</b><span>${t('bestN', { n: daysText(state.bestStreak) })}</span></div>
    <div class="pg-kpi"><small>${t('kDone')}</small><b>${t('ofN', { a: num(cur.done), b: num(cur.tasks.length) })}</b><span>${cur.tasks.length ? t('ofPlan', { p: pct(cur.done / cur.tasks.length) }) : '—'}</span></div>
    <div class="pg-kpi"><small>${t('kGoals')}</small><b>${num(cur.goalsHit)}</b>${prev ? delta(cur.goalsHit, prev.goalsHit, num) : `<span>${t('ofN', { a: num(cur.goalsHit), b: num(cur.goals) })}</span>`}</div>
  </div>`;
}

function insightsHTML(cur, prev) {
  const out = [], d0 = today();
  for (const s of upcomingExams().filter(s => daysBetween(d0, s.exam) <= 14)) {
    const r = readiness(s), w = inDays(daysBetween(d0, s.exam));
    if (!r.n) { out.push(['!', '#a3402a', t('insNoTasks', { s: esc(s.name), w })]); break; }
    if (r.p < .6) { out.push(['!', '#a3402a', t('insExam', { s: esc(s.name), w, m: duration(r.left) })]); break; }
  }
  if (state.log.length >= 5) {
    const a = bestWindow(hourMinutes(state.log));
    out.push(['☀', '#9a7a2c', t('insHours', { a: hourName(a), b: hourName((a + 3) % 24) })]);
  }
  if (prev?.minutes && cur.minutes !== prev.minutes)
    out.push(cur.minutes > prev.minutes ? ['↗', '#3f6b8a', t('insUp', { m: hoursText(cur.minutes - prev.minutes), p: lastP() })]
                                        : ['↘', '#9a7a2c', t('insDown', { m: hoursText(prev.minutes - cur.minutes), p: lastP() })]);
  const g = guardStats(cur.log);
  if (g && g.avg >= 2) out.push(['☏', '#a3402a', t('insGuard', { n: timesText(Math.round(g.avg)) })]);
  const stuck = liveTasks().filter(x => !x.ok && (x.moved || 0) >= 3).sort((a, b) => b.moved - a.moved)[0];
  if (stuck) out.push(['↻', '#a0506e', t('insStuck', { t: esc(stuck.title || subj(stuck.subject)?.name || ''), n: timesText(stuck.moved) })]);
  if (!out.length) out.push(['✦', '#4f7d4a', t(state.log.length || cur.minutes ? 'insKeep' : 'insEmpty')]);
  return `<div class="pg-ins">${out.slice(0, 3).map(([i, c, txt]) => `<div style="--c:${c}"><i>${i}</i><div>${txt}</div></div>`).join('')}</div>`;
}

// One column per day (week, month) or per week (all time), stacked by subject, with the plan dashed
function barsHTML() {
  const t0 = parseDay(today());
  let cols;
  if (period === 'all') {
    const ws = weekStart(t0), fmt = new Intl.DateTimeFormat(locale(), { day: 'numeric', month: 'short' });
    cols = [...Array(12)].map((_, i) => {
      const a = addDays(ws, (i - 11) * 7);
      return { days: [...Array(7)].map((_, k) => isoDay(addDays(a, k))), label: i % 3 === 2 ? fmt.format(a) : '' };
    });
  } else {
    const n = PERIOD_DAYS[period], wd = new Intl.DateTimeFormat(locale(), { weekday: 'short' });
    cols = [...Array(n)].map((_, i) => {
      const d = addDays(t0, i - n + 1);
      return { days: [isoDay(d)], label: n === 7 ? wd.format(d) : (n - 1 - i) % 5 === 0 ? num(d.getDate()) : '' };
    });
  }
  const order = state.subjects.map(s => s.id), used = new Set();
  for (const c of cols) {
    const log = state.log.filter(e => c.days.includes(e.d)), by = {};
    for (const e of log) { const k = anySubj(e.s) ? String(e.s) : ''; by[k] = (by[k] || 0) + e.m; }
    const perDay = loggedByDay(log);
    c.total = c.days.reduce((a, d) => a + dayMinutes(d, perDay[d]), 0);
    const logged = log.reduce((a, e) => a + e.m, 0);
    if (c.total > logged) by[''] = (by[''] || 0) + c.total - logged;
    c.segs = Object.entries(by).sort((a, b) => (a[0] === '' ? 1e9 : order.indexOf(a[0])) - (b[0] === '' ? 1e9 : order.indexOf(b[0])));
    c.segs.forEach(([k]) => used.add(k));
    c.plan = period === 'all' ? 0 : planOf(c.days[0]);
  }
  // A day with many carried-over tasks plans far more than anyone studies; it may not flatten the rest
  const most = Math.max(60, ...cols.map(c => c.total)), top = Math.max(most, Math.min(most * 1.5, Math.max(...cols.map(c => c.plan))));
  const showVal = cols.length <= 12;
  const html = cols.map(c => `<div class="pg-col" title="${c.days.length === 1 ? esc(dayName(c.days[0])) + ' · ' : ''}${duration(c.total)}">
      <div class="pg-box"><div class="pg-stack" style="height:${(c.total / top * 100).toFixed(1)}%">${c.segs.map(([k, m]) => `<span style="height:${(m / c.total * 100).toFixed(1)}%;background:${anySubj(k)?.color || NO_SUBJ}"></span>`).join('')}</div>
      ${c.plan ? `<i class="pg-plan" style="bottom:${Math.min(100, c.plan / top * 100).toFixed(1)}%"></i>` : ''}</div>
      <b>${showVal && c.total ? num(hrs(c.total)) : ''}</b><small>${c.label}</small></div>`).join('');
  const legend = [...used].sort((a, b) => (a === '' ? 1e9 : order.indexOf(a)) - (b === '' ? 1e9 : order.indexOf(b)))
    .map(k => `<span style="--c:${anySubj(k)?.color || NO_SUBJ}"><i></i>${esc(anySubj(k)?.name || t('noSubject'))}</span>`).join('');
  return `<div class="pg-card"><h3>${t(period === 'all' ? 'cWeekly' : 'cDaily')}<small>${t('cHoursUnit')}</small></h3>
    <div class="pg-bars" style="--gap:${cols.length > 12 ? 3 : 10}px">${html}</div>
    <div class="pg-legend">${legend}${period === 'all' ? '' : `<span><i class="dash"></i>${t('cPlanned')}</span>`}</div></div>`;
}

function heatHTML() {
  const t0 = today(), start = addDays(weekStart(parseDay(t0)), -77), perDay = loggedByDay(state.log);
  const level = m => !m ? 0 : m < 30 ? 1 : m < 60 ? 2 : m < 120 ? 3 : 4;
  const weeks = [...Array(12)].map((_, w) => `<div>${[...Array(7)].map((_, k) => {
    const d = isoDay(addDays(start, w * 7 + k));
    if (d > t0) return '<i class="f"></i>';
    const m = dayMinutes(d, perDay[d]);
    return `<i style="--h:${SHADES[level(m)]}" title="${esc(dayName(d))} · ${duration(m)}"></i>`;
  }).join('')}</div>`).join('');
  return `<div class="pg-card"><h3>${t('cHeat')}<small>${t('cHeatSub')}</small></h3><div class="pg-heat">${weeks}</div>
    <div class="pg-key">${t('fewer')} ${SHADES.map(h => `<i style="--h:${h}"></i>`).join('')} ${t('more')}</div></div>`;
}

function subjectsHTML(cur) {
  const by = {};
  for (const e of cur.log) { const k = anySubj(e.s) ? String(e.s) : ''; by[k] = (by[k] || 0) + e.m; }
  const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), sum = rows.reduce((a, r) => a + r[1], 0);
  const body = rows.length ? rows.map(([k, m]) => `<div class="pg-subj" style="--c:${anySubj(k)?.color || NO_SUBJ}"><span>${esc(anySubj(k)?.name || t('noSubject'))}</span>
      <div class="t"><span style="width:${(m / rows[0][1] * 100).toFixed(1)}%"></span></div><small>${hoursText(m)} · ${pct(m / sum)}</small></div>`).join('')
    : `<p class="pg-none">${t(cur.minutes ? 'subjFromNow' : 'insEmpty')}</p>`;
  return `<div class="pg-card"><h3>${t('cSubjects')}<small>${t('cSubjectsSub')}</small></h3>${body}</div>`;
}

function hoursHTML(cur) {
  const log = cur.log.length >= 5 ? cur.log : state.log;
  if (log.length < 3) return `<div class="pg-card"><h3>${t('cHours')}<small>${t('cHoursSub')}</small></h3><p class="pg-none">${t('hoursEmpty')}</p></div>`;
  const h = hourMinutes(log), top = Math.max(...h), a = bestWindow(h);
  const best = new Set([a, (a + 1) % 24, (a + 2) % 24]);
  return `<div class="pg-card"><h3>${t('cHours')}<small>${t('cHoursSub')}</small></h3>
    <div class="pg-hours">${h.map((v, i) => `<i class="${best.has(i) && v ? 'top' : ''}" style="height:${Math.max(3, v / top * 100).toFixed(1)}%" title="${hourName(i)} · ${duration(v)}"></i>`).join('')}</div>
    <div class="pg-hl">${[0, 6, 12, 18, 23].map(i => `<span>${hourName(i)}</span>`).join('')}</div></div>`;
}

const ring = (p, c) => `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="26" fill="none" stroke="rgb(29 43 36 / .08)" stroke-width="7"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="${c}" stroke-width="7" stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="${(163.4 * (1 - p)).toFixed(1)}" transform="rotate(-90 32 32)"/>
  <text x="32" y="37" text-anchor="middle" font-size="14" fill="#1d2b24">${pct(p)}</text></svg>`;
function examsHTML() {
  const list = upcomingExams().slice(0, 4), d0 = today();
  const body = list.length ? list.map(s => {
    const r = readiness(s), w = inDays(daysBetween(d0, s.exam));
    const note = !r.n ? t('noExamTasks') : r.p >= .8 ? t('onTrack') : t('leftPlan', { m: duration(r.left) });
    return `<div class="pg-exam">${ring(r.p, s.color)}<div><b>${esc(s.name)}</b><small>${t('examWhen', { w })} · ${note}</small></div></div>`;
  }).join('') : `<p class="pg-none">${t('examsEmpty')}</p>`;
  return `<div class="pg-card"><h3>${t('cExams')}<small>${t('cExamsSub')}</small></h3>${body}</div>`;
}

function guardStats(log) {
  const g = log.filter(e => e.l != null);
  return g.length < 3 ? null : { calm: g.filter(e => !e.l).length / g.length, avg: g.reduce((a, e) => a + e.l, 0) / g.length };
}
function followHTML(cur) {
  const late = liveTasks().filter(x => !x.ok && (x.moved || 0) >= 2).sort((a, b) => b.moved - a.moved).slice(0, 3);
  const dash = '—';
  return `<div class="pg-card"><h3>${t('cFollow')}</h3><div class="pg-ft">
    <div><b>${cur.tasks.length ? pct(cur.done / cur.tasks.length) : dash}</b><small>${t('fDone')}</small></div>
    <div><b>${cur.goals ? pct(cur.goalsHit / cur.goals) : dash}</b><small>${t('fGoals')}</small></div>
    <div><b dir="ltr">${cur.planned ? num(+(cur.spent / cur.planned).toFixed(1)) + '×' : dash}</b><small>${t('fRatio')}</small></div></div>
    ${(g => g ? `<p class="pg-none" style="margin-top:12px">${t('guardLine', { p: pct(g.calm), n: timesText(Math.round(g.avg * 10) / 10) })}</p>` : '')(guardStats(cur.log))}
    ${late.length ? `<ul class="pg-late">${late.map(x => `<li><span>${esc(x.title || subj(x.subject)?.name || '')}</span><small>${t('postponedN', { n: timesText(x.moved) })}</small></li>`).join('')}</ul>` : ''}</div>`;
}

function rewardsHTML() {
  const i = levelIndex(state.xp), lo = LEVELS[i][0], hi = LEVELS[i + 1]?.[0];
  const p = hi ? ((state.xp - lo) / (hi - lo)) * 100 : 100;
  return `<div class="pg-rewards"><svg viewBox="0 0 120 120" aria-hidden="true"><ellipse cx="60" cy="110" rx="40" ry="6" fill="rgb(0 0 0 / .2)"/>
      <rect x="56" y="62" width="8" height="48" rx="3" fill="#8b6a4f"/><circle cx="60" cy="48" r="30" fill="#6b8f5a"/><circle cx="40" cy="60" r="18" fill="#5a7d4c"/><circle cx="80" cy="60" r="18" fill="#7fa06a"/>
      ${i >= 4 ? '<circle cx="50" cy="40" r="4" fill="#e5bd72"/><circle cx="72" cy="52" r="4" fill="#e5bd72"/>' : ''}</svg>
    <div><b>${t('levelName', { n: num(i + 1), name: levelName(i) })}</b>
      <small>${t('rewardsSub', { v: num(state.visitors.length), vn: num(VISITORS.length), b: num(state.badges.length), bn: num(BADGES.length) })} · ${hi ? t('toNext', { n: num(hi - state.xp), name: levelName(i + 1) }) : t('topLevel')}</small>
      <div class="xpbar"><span style="width:${p.toFixed(1)}%"></span></div></div>
    <button data-gview="grove">${t('collection')}</button></div>`;
}

      <div><b>${b[L()]}</b><span>${b.how[L()]}</span></div></div>`).join('')}</div></div>`;

function mistakesHTML() {
  const all = state.mistakes.filter(m => !m.deleted && anySubj(m.s)), open = all.filter(m => !m.done);
  const list = [...open.sort((a, b) => b.at - a.at), ...all.filter(m => m.done).sort((a, b) => b.at - a.at)].slice(0, 8);
  const ago = m => new Intl.RelativeTimeFormat(locale(), { numeric: 'auto' }).format(-Math.round((Date.now() - m.at) / 864e5), 'day');
  return `<div class="pg-card"><h3>${t('mistakes')}${all.length ? `<small>${t('mistakesSub', { n: num(open.length) })}</small>` : ''}</h3>
    ${list.length ? list.map(m => `<button class="pg-mist ${m.done ? 'done' : ''}" data-mdone="${m.id}" ${parentView ? 'disabled' : ''}><i></i>
      <span>${esc(m.text)}<small>${esc(anySubj(m.s).name)} · ${ago(m)}</small></span></button>`).join('') : `<p class="pg-none">${t('mistakesEmpty')}</p>`}</div>`;
}
/* ---------- Study with friends ----------
   A group shares a nickname, "focusing now" with the subject colour, and this week's focus
   minutes. The membership secret stays on this device; Supabase only keeps its hash. */
const group = load('grove.group', { secret: null, code: null, nick: '' });
let groupData = null, groupErr = '';
const groupWeek = () => { const d = parseDay(today()); return isoDay(addDays(d, -((d.getDay() + 1) % 7))); };   // weeks start on Saturday
const weekMinutes = () => Object.entries(state.days).filter(([d]) => d >= groupWeek() && d <= today()).reduce((a, [, r]) => a + (r.minutes || 0), 0);
async function pushStatus() {
  if (!group.secret || parentView || !navigator.onLine) return;
  const studying = running && phase === 'focus';
  try { await rpc('grove_group_update', { p_secret: group.secret, p_studying: studying, p_color: studying ? subj(activeTask()?.subject)?.color || '#4f7563' : null, p_week_start: groupWeek(), p_week_minutes: weekMinutes() }); } catch {}
}
async function pullGroup() {
  if (!group.secret || !navigator.onLine) return;
  try {
    groupData = await rpc('grove_group_view', { p_secret: group.secret }); groupErr = '';
    if (!groupData) { Object.assign(group, { secret: null, code: null }); save('grove.group', group); }
  } catch { groupErr = t('syncError'); }
  if (screen === 'grove' && groveView === 'friends') renderGrove();
}
setInterval(() => { pushStatus(); if (screen === 'grove' && groveView === 'friends') pullGroup(); }, 60000);
