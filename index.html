/* ---------- Sound (synthesised, no files needed) ----------
   Soft pink/brown noise beds on long seamless loops, faded in and out so nothing
   starts or stops abruptly. Switching sounds cross-fades between them. */
const audio = (() => {
  let ctx, out, master;
  const buffers = {};
  const FADE_IN = 3, FADE_OUT = 2;

  function unlock() {
    if (!ctx) {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      // Gentle top-end roll-off on everything so no layer can sound harsh
      const tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 6500; tone.Q.value = .5;
      master = ctx.createGain(); master.gain.value = level(settings.vol);
      out = ctx.createDynamicsCompressor(); out.threshold.value = -24; out.ratio.value = 3;
      master.connect(tone).connect(out).connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }
  // Perceptual curve: the slider feels even and the top end stays comfortable
  const level = v => 0.55 * v * v;

  function noiseBuffer(kind) {
    if (buffers[kind]) return buffers[kind];
    const sr = ctx.sampleRate, n = sr * 12, f = sr, raw = new Float32Array(n + f);
    let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0, peak = 0;
    for (let i = 0; i < n + f; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'pink') {
        b0 = .99886 * b0 + w * .0555179; b1 = .99332 * b1 + w * .0750759; b2 = .969 * b2 + w * .153852;
        b3 = .8665 * b3 + w * .3104856; b4 = .55 * b4 + w * .5329522; b5 = -.7616 * b5 - w * .016898;
        raw[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * .5362; b6 = w * .115926;
      } else {
        raw[i] = last = (last + .02 * w) / 1.02;
      }
      peak = Math.max(peak, Math.abs(raw[i]));
    }
    // Blend the tail into the head so the loop point has no click
    const buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = raw[i] / peak * .9;
    for (let i = 0; i < f; i++) { const a = i / f; d[i] = (raw[i] * a + raw[n + i] * (1 - a)) / peak * .9; }
    return (buffers[kind] = buf);
  }

  function layer() {
    const g = ctx.createGain(); g.gain.value = 0; g.connect(master);
    const L = { g, nodes: [], timers: [] };
    L.noise = kind => {
      const s = ctx.createBufferSource(); s.buffer = noiseBuffer(kind); s.loop = true;
      s.start(0, Math.random() * 10); L.nodes.push(s); return s;
    };
    L.osc = (rate, depth, target) => {
      const o = ctx.createOscillator(), d = ctx.createGain(); o.frequency.value = rate; d.gain.value = depth;
      o.connect(d).connect(target); o.start(); L.nodes.push(o);
    };
    return L;
  }
  const filt = (type, freq, q = .7) => { const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; return f; };
  const amp = v => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const chain = (...n) => { n.reduce((a, b) => a.connect(b)); return n[n.length - 1]; };

  const SOUNDS = {
    rain(L) {
      chain(L.noise('pink'), filt('highpass', 250), filt('lowpass', 2800, .5), amp(.32), L.g);
      chain(L.noise('brown'), filt('lowpass', 420), amp(.35), L.g);
    },
    wind(L, lvl = .7) {
      const lp = filt('lowpass', 360, .8), g = amp(lvl);
      chain(L.noise('brown'), lp, g, L.g);
      L.osc(.045, 140, lp.frequency);    // slow sweep
      L.osc(.08, lvl * .3, g.gain);      // gusts
    },
    stream(L) {
      const g = amp(.5);
      chain(L.noise('brown'), filt('bandpass', 650, .5), g, L.g);
      L.osc(.33, .08, g.gain);
      const ripple = amp(.06);
      chain(L.noise('pink'), filt('bandpass', 1500, .9), ripple, L.g);
      L.osc(.5, .03, ripple.gain);
    },
    forest(L) {
      SOUNDS.wind(L, .4);
      const birds = chain(filt('lowpass', 3200, .5), L.g);
      const chirp = () => {
        const t0 = ctx.currentTime + .05, base = 1500 + Math.random() * 900, notes = 2 + Math.floor(Math.random() * 3);
        const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
        if (pan) { pan.pan.value = Math.random() * 1.4 - .7; pan.connect(birds); }
        for (let i = 0; i < notes; i++) {
          const o = ctx.createOscillator(), g = amp(0), s = t0 + i * .16;

          o.frequency.setValueAtTime(base, s);
          o.frequency.exponentialRampToValueAtTime(base * 1.18, s + .09);
          g.gain.setValueAtTime(0, s);
          g.gain.linearRampToValueAtTime(.018, s + .03);
          g.gain.exponentialRampToValueAtTime(.0001, s + .16);
          o.connect(g).connect(pan || birds); o.start(s); o.stop(s + .18);
        }
        L.timers.push(setTimeout(chirp, 4000 + Math.random() * 7000));
      };
      L.timers.push(setTimeout(chirp, 2500));
    }
  };

  function fadeOut(L) {
    const t = ctx.currentTime;
    L.g.gain.cancelScheduledValues(t);
    L.g.gain.setValueAtTime(L.g.gain.value, t);
    L.g.gain.linearRampToValueAtTime(0, t + FADE_OUT);
    L.timers.forEach(clearTimeout);
    setTimeout(() => { L.nodes.forEach(n => { try { n.stop(); } catch {} }); L.g.disconnect(); }, FADE_OUT * 1000 + 100);
  }
  // Recorded CC0 loops ship in sounds/; a layer without its file falls back to the synthesised one
  const files = {};
  const recording = name => files[name] ??= fetch(`sounds/${name}.ogg`)
    .then(r => r.ok ? r.arrayBuffer() : null).then(b => b && ctx.decodeAudioData(b)).catch(() => null);
  const playing = {};
  function mix(levels) {
    unlock();
    for (const name of Object.keys(SOUNDS)) {
      const want = levels[name] || 0, L = playing[name], t = ctx.currentTime;
      if (!want) { if (L) { fadeOut(L); delete playing[name]; } continue; }
      if (L) { L.g.gain.cancelScheduledValues(t); L.g.gain.setTargetAtTime(want, t, .4); continue; }
      const N = playing[name] = layer();
      N.g.gain.setValueAtTime(0, t); N.g.gain.linearRampToValueAtTime(want, t + FADE_IN);
      recording(name).then(buf => {
        if (playing[name] !== N) return;
        if (!buf) return SOUNDS[name](N);
        const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
        src.connect(N.g); src.start(0, Math.random() * buf.duration); N.nodes.push(src);
      });
    }
  }
  function bell() {
    unlock();
    // A soft, low singing-bowl tone: slow attack, long decay, no sharp overtones
    const t0 = ctx.currentTime + .02, soft = filt('lowpass', 1800, .5), g = amp(Math.max(.35, settings.vol));
    soft.connect(g).connect(out);
    [[392, .09], [588, .025], [784, .02], [1178, .006]].forEach(([f, v], i) => {
      const o = ctx.createOscillator(), e = amp(0);
      o.frequency.value = f * (1 + (i ? .002 : 0));
      e.gain.setValueAtTime(0, t0);
      e.gain.linearRampToValueAtTime(v, t0 + .08);
      e.gain.exponentialRampToValueAtTime(.0001, t0 + 6);
      o.connect(e).connect(soft); o.start(t0); o.stop(t0 + 6.1);
    });
  }
  function volume(v) { if (master) master.gain.setTargetAtTime(level(v), ctx.currentTime, .2); }
  return { unlock, mix, bell, volume };
})();

let syncErr = '';
// The code itself is the QR payload; qrcode-generator is bundled in vendor/

  document.head.append(s);

async function linkCode(code) {

}
async function scanCode() {
  let stream;

    await loadJsQR();

  } catch (e) { syncErr = t(e?.name === 'NotAllowedError' ? 'noCamera' : 'syncError'); return renderSyncBox(); }

  $('#settings').close();

  box.className = 'scanner';
  box.innerHTML = `<video playsinline muted></video><span class="frame"></span><button type="button">${t('cancel')}</button>`;
  document.body.append(box);
  const video = box.querySelector('video'), canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  video.srcObject = stream;
  video.play().catch(() => {});

    box.querySelector('button').onclick = () => done(null);

      if (!box.isConnected) return;

        // A downscaled frame decodes fast enough and still reads a phone-screen QR code
        const k = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
        canvas.width = Math.round(video.videoWidth * k); canvas.height = Math.round(video.videoHeight * k);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  });

  box.remove();

  if (code) await linkCode(cleanCode(code));
}
/* ---------- Reminders ----------

const notif = window.__TAURI__?.notification;
const isPhone = /Android|iPhone|iPad/i.test(navigator.userAgent);
function remindersAhead(days, after = Date.now()) {
  if (!settings.remind) return [];
  const out = [], [hh, mm] = settings.remindAt.split(':').map(Number), d0 = today();
  const studied = (state.days[d0]?.minutes || 0) > 0, next = activeTask();
  for (let i = 0; i < days; i++) {
    const day = addDays(parseDay(d0), i), k = isoDay(day), at = (h, m) => { const x = new Date(day); x.setHours(h, m, 0, 0); return x; };
    const skip = i === 0 && studied;
    if (!skip) out.push({ id: i * 10 + 1, at: at(hh, mm), title: t('rmStudyT'), body: t('rmStudy', { t: i === 0 && next ? t('rmNext', { t: next.title }) : '' }) });
    if (!skip && (streak() > 0 || i > 0)) out.push({ id: i * 10 + 2, at: at(21, 0), title: t('rmStreakT'), body: i === 0 ? t('rmStreak', { n: daysText(streak()) }) : t('rmStreakLater') });
    const exam = liveSubjects().find(s => s.exam && [1, 3].includes(daysBetween(k, s.exam)));
    if (exam) out.push({ id: i * 10 + 3, at: at(9, 0), title: t('rmExamT', { s: exam.name, w: inDays(daysBetween(k, exam.exam)) }),
      body: t('rmExam') + ((n => n ? t('rmExamM', { n: num(n) }) : '')(state.mistakes.filter(m => m.s === exam.id && !m.done && !m.deleted).length)) });
    if (day.getDay() === 5) out.push({ id: i * 10 + 4, at: at(18, 0), title: t('rmReportT'), body: t('rmReport') });
  }
  return out.filter(r => r.at > after);
}
let remindTimer;
function scheduleReminders() {
  if (!notif || parentView || !isPhone) return;
  clearTimeout(remindTimer);
  remindTimer = setTimeout(async () => {
    try {
      if (!(await notif.isPermissionGranted())) return;
      await notif.cancel([...Array(70)].map((_, i) => i + 1));
      for (const r of remindersAhead(7)) notif.sendNotification({ id: r.id, title: r.title, body: r.body, schedule: notif.Schedule.at(r.at, false, true) });
    } catch {}

}
// Desktop: fire what has come due in the last two hours, once each per day
const reminded = load('grove.reminded', { day: '', ids: [] });
async function checkReminders() {
  if (!notif || parentView || isPhone || !settings.remind) return;
  if (reminded.day !== today()) { reminded.day = today(); reminded.ids = []; }
  const now = Date.now();
  for (const r of remindersAhead(1, 0)) {
    if (r.at <= now && now - r.at < 2 * 3600e3 && !reminded.ids.includes(r.id)) {
      reminded.ids.push(r.id); save('grove.reminded', reminded);
      try { if (await notif.isPermissionGranted()) notif.sendNotification({ title: r.title, body: r.body }); } catch {}
    }

}

};
$('#confirm').onclick = e => {
  const a = e.target.closest('[data-cf]')?.dataset.cf, kind = confirmKind;
  if (!a) return;
  confirmKind = null;
  if (a === 'reset') reset();
  else if (a === 'switch') setPhase(kind);
  else if (resumeAfter) start(); else render();
  resumeAfter = false;
};
// 60 minute ticks around the dial, longer every five
$('#ticks').innerHTML = [...Array(60)].map((_, i) => {
  const a = i / 60 * Math.PI * 2, r1 = i % 5 ? 95 : 92.5, r2 = 97.5;
  return `<line x1="${(100 + r1 * Math.sin(a)).toFixed(2)}" y1="${(100 - r1 * Math.cos(a)).toFixed(2)}" x2="${(100 + r2 * Math.sin(a)).toFixed(2)}" y2="${(100 - r2 * Math.cos(a)).toFixed(2)}"/>`;
}).join('');
$('#resetBtn').onclick = askReset;
$('#endBtn').onclick = () => phase === 'focus' ? endSession() : skip();
$$('.modes button').forEach(b => b.onclick = () => askPhase(b.dataset.phase));

const fields = ['focus', 'short', 'long', 'every'];
$('#settingsBtn').onclick = () => {
  fields.forEach(f => $('#s-' + f).value = settings[f]);
  $('#s-auto').checked = settings.auto; $('#s-chime').checked = settings.chime; $('#s-lang').value = settings.lang;
  $('#remindRow').hidden = $('#remindAtRow').hidden = !notif || parentView;
  $('#s-remind').checked = settings.remind; $('#s-remindAt').value = settings.remindAt; $('#s-tips').checked = settings.tips !== false;
  $('#s-living').checked = settings.living !== false; wxEditing = false; wxResults = []; wxErr = ''; renderWxBox();
  renderSyncBox(); restoreOpen = false; renderBackupBox();
  window.__TAURI__?.app?.getVersion().then(v => $('#verLbl').innerHTML = t('versionLbl', { v }));
  $('#checkUpd').hidden = !tauriCore;
  $('#settings').showModal();
};
$('#settings').addEventListener('close', () => {
  const was = JSON.stringify(sharedSettings());
  fields.forEach(f => {
    const el = $('#s-' + f), v = Math.round(+el.value);
    if (v >= +el.min && v <= +el.max) settings[f] = v;
  });
  settings.auto = $('#s-auto').checked; settings.chime = $('#s-chime').checked; settings.tips = $('#s-tips').checked; settings.living = $('#s-living').checked;
  if (/^\d\d:\d\d$/.test($('#s-remindAt').value)) settings.remindAt = $('#s-remindAt').value;
  const remindOn = $('#s-remind').checked && !settings.remind;
  settings.remind = $('#s-remind').checked;
  if (remindOn) notif?.isPermissionGranted().then(ok => ok || notif.requestPermission().then(p => p === 'granted')).then(ok => { if (!ok) toast(t('noNotify')); scheduleReminders(); });
  else scheduleReminders();
  const langChanged = settings.lang !== $('#s-lang').value;
  settings.lang = $('#s-lang').value;
  if (JSON.stringify(sharedSettings()) !== was) { settings.updatedAt = Date.now(); scheduleSync(); }
  save('grove.settings', settings);
  if (langChanged) applyLang();
  if (!running) setPhase(phase);
  renderAll();
  setTimeout(() => { renderVisitors(); moveInd($('.modes')); moveInd($('.dock')); }, 50);
});
const mixOn = () => Object.values(settings.mix).some(v => v > 0);
function markSound() {
  $$('#soundList button').forEach(b => b.setAttribute('aria-pressed', !!settings.mix[b.dataset.sound]));
  $$('#soundList [data-mix]').forEach(r => { r.hidden = !settings.mix[r.dataset.mix]; if (settings.mix[r.dataset.mix]) r.value = settings.mix[r.dataset.mix]; });
  $('#soundBtn').setAttribute('aria-pressed', mixOn());
}
$('#soundBtn').onclick = () => { $('#vol').value = settings.vol; markSound(); $('#soundDlg').showModal(); };
$$('#soundList button').forEach(b => b.onclick = () => {
  const k = b.dataset.sound;
  if (settings.mix[k]) delete settings.mix[k]; else settings.mix[k] = .7;
  audio.mix(settings.mix); markSound(); save('grove.settings', settings);
});
$$('#soundList [data-mix]').forEach(r => r.oninput = () => { settings.mix[r.dataset.mix] = +r.value; audio.mix(settings.mix); save('grove.settings', settings); });
$('#vol').oninput = e => { settings.vol = +e.target.value; audio.volume(settings.vol); save('grove.settings', settings); };

document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea') || document.querySelector('dialog[open]')) return;
  if (sheetKind) { if (e.key === 'Escape') closeSheet(); return; }
  if (e.key === '1' || e.key === '2' || e.key === '3') return go(ORDER[+e.key - 1]);
  if (screen !== 'timer') return;
  if (e.code === 'Space') { e.preventDefault(); running ? pause() : start(); }
  else if (e.key === 'r' || e.key === 'R') askReset();
  else if (e.key === 's' || e.key === 'S') { if (phase !== 'focus') skip(); else if (remaining < total) endSession(); }
});
// Ambient sound needs a user gesture before it may play, so resume it on the first tap
if (mixOn()) document.addEventListener('pointerdown', () => { audio.mix(settings.mix); markSound(); }, { once: true });

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { measureScene(); placeSun(sunP); renderVisitors(); moveInd($('.modes')); moveInd($('.dock')); }, 150);
});

/* Desktop app: the window is frameless and full screen, so it brings its own controls */
const appWindow = window.__TAURI__?.window?.getCurrentWindow?.();
if (appWindow && !/Android|iPhone|iPad/i.test(navigator.userAgent)) {
  $('#winctl').hidden = false; $('.dragbar').hidden = false;
  document.body.classList.add('has-winctl');
  const FULL = 'M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5', WINDOWED = 'M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5';
  const syncFull = async () => $('#winFullPath').setAttribute('d', (await appWindow.isFullscreen()) ? WINDOWED : FULL);
  const toggleFull = async () => { await appWindow.setFullscreen(!(await appWindow.isFullscreen())); syncFull(); };
  $('#winMin').onclick = () => appWindow.minimize();
  $('#winClose').onclick = () => appWindow.close();
  $('#winFull').onclick = toggleFull;
  addEventListener('keydown', e => { if (e.key === 'F11') { e.preventDefault(); toggleFull(); } });
  syncFull();
}

applyLang();
if (parentView) {
  save('grove.parent', parent);
  document.body.classList.add('parent');
  go('grove');
  pullView();
  setInterval(pullView, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pullView(); });
} else { rollover(); restoreTimer(); scheduleReminders(); checkReminders(); fetchWeather(); showNewsIfUpdated(); }
applySky();
renderAll();
renderVisitors();
markSound();
syncNow();
live.connect();
checkUpdate();
setInterval(checkUpdate, 6 * 3600e3);
document.fonts?.ready.then(() => { moveInd($('.modes')); moveInd($('.dock')); });
moveInd($('.dock'));
</script>
</body>
</html>
